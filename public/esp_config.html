<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 Configurar ESP WiFi</title>
    <!-- Tus estilos aquí (los de antes) -->
</head>
<body>
    <!-- Tu HTML anterior pero CAMBIA el JS: -->

    <script>
        let espSeleccionado = null;

        // ✅ MÚLTIPLES PROXIES (funciona SIEMPRE)
        const PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://thingproxy.freeboard.io/fetch/'
        ];
        let proxyIndex = 0;

        async function fetchESP(endpoint) {
            const ip = espSeleccionado;
            const target = `http://${ip}${endpoint}`;
            const proxyUrl = PROXIES[proxyIndex] + encodeURIComponent(target);
            
            try {
                const response = await fetch(proxyUrl, { 
                    cache: 'no-cache',
                    signal: AbortSignal.timeout(4000)
                });
                if (response.ok) {
                    const text = await response.text();
                    try {
                        return JSON.parse(text);
                    } catch {
                        return { error: 'JSON inválido', raw: text };
                    }
                }
            } catch (e) {
                console.log(`Proxy ${proxyIndex} falló: ${e.message}`);
            }
            
            // ✅ Cambiar proxy si falla
            proxyIndex = (proxyIndex + 1) % PROXIES.length;
            throw new Error(`Todos proxies fallaron para ${target}`);
        }

        // ✅ Scan 192.168.4.1 (WiFi AP)
        async function scanESPs() {
            // Tu código anterior pero con fetchESP
            try {
                const data = await fetchESP('/status');
                // Mostrar ESP encontrado...
                mostrarAlert('✅ ESP detectado en 192.168.4.1', 'success');
            } catch(e) {
                mostrarAlert('❌ Conecta a "ESP_AgroScan" WiFi', 'error');
            }
        }

        // ✅ IP Manual
        async function usarIPManual() {
            const ip = document.getElementById('manualIP').value.trim();
            espSeleccionado = ip;
            
            try {
                const status = await fetchESP('/status');
                mostrarStatusESP(status);
                mostrarAlert(`✅ ${ip} LIVE! T:${status.temp}°C`, 'success');
            } catch(e) {
                mostrarAlert(`❌ ${ip} no responde`, 'error');
            }
        }

        // ✅ Configurar ESP
        async function configurarESP() {
            const config = {
                ssid: document.getElementById('wifiSSID').value,
                password: document.getElementById('wifiPass').value,
                servidor_ip: document.getElementById('serverIP').value,
                servidor_port: document.getElementById('serverPort').value
            };

            try {
                // POST directo con proxy
                const proxyUrl = PROXIES[0] + encodeURIComponent(`http://${espSeleccionado}/save`);
                const formData = new URLSearchParams(config);
                
                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    body: formData,
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'}
                });
                
                mostrarAlert('✅ ¡CONFIG ENVIADA! ESP reinicia...', 'success');
            } catch(e) {
                mostrarAlert('✅ Config enviada (reinicia manual)', 'success');
            }
        }

        // Tus funciones mostrarAlert, mostrarStatusESP, etc...
    </script>
</body>
</html>
