<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 AgroMonitor ESP 10.132.48.90</title>
    <!-- CSS igual que antes -->
</head>
<body>
    <!-- HTML igual hasta script -->
    <script>
        let espIP = '10.132.48.90'; // ¡TU ESP!

        // 🔍 DIRECTO A TU ESP
        async function scanESPs() {
            const list = document.getElementById('espList');
            list.innerHTML = `<div class="loading">🔍 Conectando ${espIP}...</div>`;
            
            try {
                const response = await fetch(`http://${espIP}/status`);
                const data = await response.json();
                
                document.getElementById('espList').innerHTML = `
                    <div class="esp-item selected">
                        <strong>🌱 ESP AgroScan ${espIP}</strong><br>
                        <small>📶 LIVE | T:${data.temp||0}°C H:${data.humidity||0}%</small>
                    </div>
                `;
                
                espSeleccionado = espIP;
                document.getElementById('configForm').style.display = 'block';
                testConexion();
                
            } catch(e) {
                document.getElementById('espList').innerHTML = `
                    <div style="color:#f44336;">
                        ❌ ${espIP} offline<br>
                        <small>Ver Serial Monitor ESP</small>
                    </div>
                `;
            }
        }

        // LIVE DATA TU ESP
        async function testConexion() {
            const response = await fetch(`http://${espIP}/status`);
            const status = await response.json();
            mostrarStatusESP(status);
            document.getElementById('statusSection').style.display = 'block';
            updateStatusLive();
        }

        async function updateStatusLive() {
            try {
                const response = await fetch(`http://${espIP}/status`);
                mostrarStatusESP(await response.json());
                setTimeout(updateStatusLive, 2000);
            } catch(e) {}
        }

        // Configurar (ya no necesario, pero funciona)
        async function configurarESP() {
            alert('✅ ESP ya configurado en ' + espIP);
        }

        // INICIO
        window.onload = () => {
            document.getElementById('scanBtn').onclick = () => {
                scanESPs();
            };
            setTimeout(testConexion, 1000);
        };
    </script>
</body>
</html>
